name: Compile public source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile from public source without proprietary assets
        shell: pwsh
        run: |
          python src/build.py --source-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/build/GameRemix-source-only.exe)) { throw 'No EXE produced' }
          Get-FileHash dist/build/GameRemix-source-only.exe -Algorithm SHA256
      - name: Verify embedded resources from pinned official release
        shell: pwsh
        run: |
          python src/build.py --from-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $file = 'dist/build/GameRemix-rebuilt-from-release.exe'
          if (-not (Test-Path $file)) { throw 'Full build did not produce its EXE' }
          # Reflection-only inspection is supported by Windows PowerShell 5.1 (.NET Framework),
          # but not by GitHub's default PowerShell 7 (.NET runtime).
          $count = & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command '[Reflection.Assembly]::ReflectionOnlyLoadFrom((Resolve-Path "dist/build/GameRemix-rebuilt-from-release.exe").Path).GetManifestResourceNames().Length'
          if ($LASTEXITCODE -ne 0 -or ("$count".Trim()) -ne '106') { throw "Expected 106 embedded resources, found $count" }
          Get-FileHash $file -Algorithm SHA256
